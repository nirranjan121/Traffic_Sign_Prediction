<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediction Result - Traffic Sign Recognition</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Analysis Complete</h1>
        <div>
            <img src="{{ image_path }}" alt="Uploaded Traffic Sign" class="preview-img">
        </div>
        <div class="prediction-badge">
            Predicted Sign: {{ prediction }}
        </div>
        <div>
            <a href="/" class="btn-action">Upload Another Image</a>
        </div>
    </div>
</body>
</html>
